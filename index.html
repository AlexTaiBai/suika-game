<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>合成大西瓜</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: white; touch-action: none; overflow: hidden; }
.game-wrap { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 420px; padding: 10px; }
h1 { font-size: clamp(1.4rem, 5vw, 2rem); margin-bottom: 6px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
.info-bar { display: flex; justify-content: space-between; width: 100%; max-width: 380px; margin-bottom: 8px; font-size: clamp(0.9rem, 3.5vw, 1.1rem); font-weight: 600; }
canvas { width: 100%; max-width: 380px; height: auto; aspect-ratio: 2/3; border: 3px solid rgba(255,255,255,0.3); border-radius: 12px; background: #e8f4fc; touch-action: none; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
.controls { margin-top: 10px; text-align: center; font-size: 0.8rem; opacity: 0.85; line-height: 1.5; }
button { background: #ff4757; border: none; color: white; padding: 10px 22px; margin: 6px 4px; border-radius: 20px; font-size: 0.95rem; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:active { transform: scale(0.96); }
#muteBtn { background: #57606f; }
</style>
</head>
<body>
<div class="game-wrap">
  <h1>🍉 合成大西瓜</h1>
  <div class="info-bar">
    <span>分数: <b id="score">0</b></span>
    <span>下一个: <b id="nextFruit">🍇</b></span>
  </div>
  <canvas id="c" width="380" height="570"></canvas>
  <div class="controls">
    手指左右滑动选择位置，点击放下水果<br>
    相同水果碰撞会合成更大的水果
    <br>
    <button id="restartBtn">重新开始</button>
    <button id="muteBtn">🔊 音效开</button>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const nextEl = document.getElementById('nextFruit');
const restartBtn = document.getElementById('restartBtn');
const muteBtn = document.getElementById('muteBtn');
const W = canvas.width, H = canvas.height, GROUND = H - 15, LEFT = 15, RIGHT = W - 15, DANGER = 90;
const FRUITS = [
  { name:'葡萄', emoji:'🍇', r:16, color:'#9b59b6', score:1 },
  { name:'樱桃', emoji:'🍒', r:22, color:'#e74c3c', score:2 },
  { name:'橘子', emoji:'🍊', r:28, color:'#f39c12', score:3 },
  { name:'柠檬', emoji:'🍋', r:34, color:'#f1c40f', score:4 },
  { name:'猕猴桃', emoji:'🥝', r:40, color:'#27ae60', score:5 },
  { name:'番茄', emoji:'🍅', r:46, color:'#c0392b', score:6 },
  { name:'桃子', emoji:'🍑', r:52, color:'#e67e22', score:7 },
  { name:'菠萝', emoji:'🍍', r:58, color:'#d35400', score:8 },
  { name:'椰子', emoji:'🥥', r:64, color:'#8d6e63', score:9 },
  { name:'半西瓜', emoji:'🍉', r:72, color:'#e74c3c', score:15 },
  { name:'大西瓜', emoji:'🍉', r:82, color:'#c0392b', score:100 }
];
let audioCtx = null, muted = false;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
function playTone(freq, duration, type='sine', gainVal=0.15) { if (muted || !audioCtx) return; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime); gain.gain.setValueAtTime(gainVal, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration); }
function soundDrop() { playTone(180, 0.08, 'triangle', 0.12); }
function soundMerge(level) { const base = 300 + level * 40; playTone(base, 0.12, 'sine', 0.18); setTimeout(() => playTone(base * 1.5, 0.1, 'sine', 0.1), 40); }
function soundGameOver() { playTone(200, 0.3, 'sawtooth', 0.15); setTimeout(() => playTone(140, 0.4, 'sawtooth', 0.12), 150); }
function vibrate(ms) { if (navigator.vibrate && !muted) navigator.vibrate(ms); }
class Fruit { constructor(x, y, lv) { this.x = x; this.y = y; this.lv = lv; this.r = FRUITS[lv].r; this.vx = 0; this.vy = 0; this.dead = false; } update() { this.vy += 0.35; this.x += this.vx; this.y += this.vy; this.vx *= 0.985; this.vy *= 0.985; if (this.x - this.r < LEFT) { this.x = LEFT + this.r; this.vx *= -0.4; } if (this.x + this.r > RIGHT) { this.x = RIGHT - this.r; this.vx *= -0.4; } if (this.y + this.r > GROUND) { this.y = GROUND - this.r; this.vy *= -0.35; this.vx *= 0.7; } } draw() { const f = FRUITS[this.lv]; ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fillStyle = f.color; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2; ctx.stroke(); ctx.font = `${this.r * 0.9}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(f.emoji, this.x, this.y + 1); } }
let fruits = [], nextLv = 0, score = 0, over = false, dropX = W / 2, canDrop = true;
function randNext() { return Math.floor(Math.random() * 5); }
function updateUI() { scoreEl.textContent = score; nextEl.textContent = FRUITS[nextLv].emoji; }
function drop(x) { if (over || !canDrop) return; initAudio(); canDrop = false; fruits.push(new Fruit(x, 40, nextLv)); soundDrop(); vibrate(15); nextLv = randNext(); updateUI(); setTimeout(() => canDrop = true, 250); }
function collideAndMerge() { for (let i = 0; i < fruits.length; i++) { for (let j = i + 1; j < fruits.length; j++) { const a = fruits[i], b = fruits[j]; if (a.dead || b.dead) continue; const dx = b.x - a.x, dy = b.y - a.y; const dist = Math.hypot(dx, dy); const minD = a.r + b.r; if (dist < minD && dist > 0) { const overlap = (minD - dist) * 0.5; const nx = dx / dist, ny = dy / dist; a.x -= nx * overlap; a.y -= ny * overlap; b.x += nx * overlap; b.y += ny * overlap; const rvx = a.vx - b.vx, rvy = a.vy - b.vy; const velN = rvx * nx + rvy * ny; if (velN < 0) { const j = -1.3 * velN * 0.5; a.vx += j * nx; a.vy += j * ny; b.vx -= j * nx; b.vy -= j * ny; } if (a.lv === b.lv && a.lv < 10) { a.dead = b.dead = true; const nl = a.lv + 1; const nf = new Fruit((a.x + b.x)/2, (a.y + b.y)/2, nl); nf.vx = (a.vx + b.vx) * 0.4; nf.vy = (a.vy + b.vy) * 0.4 - 3; fruits.push(nf); score += FRUITS[nl].score; soundMerge(nl); vibrate(nl >= 8 ? 40 : 25); updateUI(); } } } } fruits = fruits.filter(f => !f.dead); }
function checkOver() { return fruits.some(f => f.y - f.r < DANGER && Math.abs(f.vy) < 0.8 && Math.abs(f.vx) < 0.8); }
function loop() { if (over) return; ctx.clearRect(0, 0, W, H); ctx.strokeStyle = 'rgba(255,80,80,0.7)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(LEFT, DANGER); ctx.lineTo(RIGHT, DANGER); ctx.stroke(); ctx.setLineDash([]); ctx.strokeStyle = '#333'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(LEFT, 0); ctx.lineTo(LEFT, GROUND); ctx.lineTo(RIGHT, GROUND); ctx.lineTo(RIGHT, 0); ctx.stroke(); fruits.forEach(f => f.update()); collideAndMerge(); fruits.forEach(f => f.draw()); if (canDrop && !over) { const f = FRUITS[nextLv]; ctx.globalAlpha = 0.45; ctx.beginPath(); ctx.arc(dropX, 40, f.r, 0, Math.PI*2); ctx.fillStyle = f.color; ctx.fill(); ctx.font = `${f.r * 0.9}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(f.emoji, dropX, 41); ctx.globalAlpha = 1; } if (checkOver()) { over = true; soundGameOver(); vibrate([50, 30, 50]); ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#fff'; ctx.font = 'bold 32px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('游戏结束', W/2, H/2 - 15); ctx.font = '20px sans-serif'; ctx.fillText('分数: ' + score, W/2, H/2 + 25); return; } requestAnimationFrame(loop); }
function getX(clientX) { const rect = canvas.getBoundingClientRect(); const scale = W / rect.width; let x = (clientX - rect.left) * scale; const r = FRUITS[nextLv].r; return Math.max(LEFT + r, Math.min(RIGHT - r, x)); }
canvas.addEventListener('pointermove', e => { if (!over) dropX = getX(e.clientX); });
canvas.addEventListener('pointerdown', e => { if (!over) { dropX = getX(e.clientX); drop(dropX); } });
restartBtn.addEventListener('click', () => { fruits = []; score = 0; over = false; nextLv = randNext(); canDrop = true; updateUI(); loop(); });
muteBtn.addEventListener('click', () => { muted = !muted; muteBtn.textContent = muted ? '🔇 音效关' : '🔊 音效开'; if (!muted) initAudio(); });
nextLv = randNext(); updateUI(); loop();
</script>
</body>
</html>
